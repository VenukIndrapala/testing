<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <meta name="theme-color" content="#1e4c7f" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta
    name="description"
    content="Air hockey against the AI. First to 7 points wins."
  />

  <title>Air Hockey</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="game-wrap" aria-label="Air hockey game">
      <canvas
        id="gameCanvas"
        aria-label="Air hockey table. Drag, or use the arrow keys or WASD, to move the blue mallet."
      ></canvas>

      <div
        class="sr-only"
        id="gameStatus"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <noscript>This game needs JavaScript to run.</noscript>

  <script src="script.js" defer></script>
</body>
</html>
